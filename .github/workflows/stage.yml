# Stages one genuine version of n8n-nodes-siteshot on npm. By hand only, from main.
#
# The operator gives three values: the commit, its version, and the SHA-256 of
# the tarball that an independent pack of that commit produced. Both jobs stop
# unless the tarball is byte for byte that one; the expected hash never comes
# from this workflow's own build.
#
# verify-pack checks out exactly the dispatched commit and refuses a different
# repository, commit, version or a private manifest. Then it installs, runs the
# full verification and packs the tarball, checking that it holds exactly the
# expected files and has the given SHA-256. Its token is read-only; it has no
# id-token and no secret, so dependencies never install or run next to a
# publishing credential.
#
# stage runs only after a reviewer approves the protected npm-stage environment.
# It checks nothing out and installs nothing: it takes the packed tarball, checks
# its SHA-256 against the given one again, and stages that file with provenance.
# The npm token exists in that single, last step.
#
# A file spec is sent as it is and runs no lifecycle script, so prepublishOnly
# (n8n-node prerelease) does not run here: the checks above are the release gate.
# Staging is not publication: the owner reviews the staged version on npm and
# approves it with 2FA.
name: Stage

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA of the main commit to stage (the commit this run is dispatched on)
        required: true
        type: string
      version:
        description: The exact version in that commit's package.json
        required: true
        type: string
      tarball_sha256:
        description: SHA-256 of the tarball from an independent pack of that commit (64 lowercase hex)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stage
  cancel-in-progress: false

jobs:
  verify-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Refuse anything but the dispatched head of main
        env:
          WANT_SHA: ${{ inputs.sha }}
          WANT_VERSION: ${{ inputs.version }}
          WANT_TARBALL_SHA256: ${{ inputs.tarball_sha256 }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          [[ "$WANT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WANT_SHA" = "$GITHUB_SHA"
          [[ "$WANT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$WANT_TARBALL_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Refuse another commit, version, repository or a private manifest
        env:
          WANT_SHA: ${{ inputs.sha }}
          WANT_VERSION: ${{ inputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$WANT_SHA"
          node -e '
            const pkg = require("./package.json");
            const repository = `git+${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}.git`;
            if (pkg.name !== "n8n-nodes-siteshot") throw new Error("package name");
            if (pkg.version !== process.env.WANT_VERSION) throw new Error("package version");
            if (pkg.private === true) throw new Error("the package is still private");
            if (pkg.repository?.url !== repository) throw new Error("repository.url names another repository");
          '

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Check the toolchain
        run: |
          test "$(node --version)" = v24.21.0
          test "$(npm --version)" = 11.19.0

      - name: Clean install
        run: npm ci
      - name: Verify
        run: npm run verify

      - name: Pack
        id: pack
        env:
          WANT_VERSION: ${{ inputs.version }}
          WANT_TARBALL_SHA256: ${{ inputs.tarball_sha256 }}
        run: |
          npm pack --json > "$RUNNER_TEMP/pack.json"
          tarball=$(node test/check-pack.mjs "$RUNNER_TEMP/pack.json" "$WANT_VERSION")
          test "$(sha256sum "$tarball" | cut -d' ' -f1)" = "$WANT_TARBALL_SHA256"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: verify-pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-stage
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball

      - name: Refuse a tarball that is not the given one
        env:
          TARBALL: n8n-nodes-siteshot-${{ inputs.version }}.tgz
          WANT_TARBALL_SHA256: ${{ inputs.tarball_sha256 }}
        run: |
          [[ "$WANT_TARBALL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$TARBALL" | cut -d' ' -f1)" = "$WANT_TARBALL_SHA256"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check the toolchain
        run: |
          test "$(node --version)" = v24.21.0
          test "$(npm --version)" = 11.19.0

      # The one step that holds the token. RELEASE_MODE only matters to the
      # n8n-node prerelease guard, and a file spec never runs it.
      - name: Stage the verified tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
          RELEASE_MODE: 'true'
          TARBALL: n8n-nodes-siteshot-${{ inputs.version }}.tgz
        run: npm stage publish "./$TARBALL" --provenance --access public
